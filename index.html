<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MARABU BOOK STUDIO</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      color: #20231f;
      background: #f7f4ed;
      font-family: Georgia, "Times New Roman", serif;
    }

    header {
      padding: 22px 7%;
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: #fffdf8;
      border-bottom: 1px solid #e5dfd2;
    }

    .logo {
      color: #23483a;
      font: 800 18px Arial, sans-serif;
      letter-spacing: 2px;
    }

    header span {
      color: #6c7169;
      font: 14px Arial, sans-serif;
    }

    main {
      width: min(1000px, 92%);
      margin: auto;
      padding: 55px 0;
    }

    .hero {
      margin-bottom: 35px;
      text-align: center;
    }

    .hero h1 {
      margin: 0 0 18px;
      color: #23483a;
      font-size: clamp(40px, 7vw, 72px);
      line-height: 1;
    }

    .hero p {
      color: #6c7169;
      font: 17px/1.6 Arial, sans-serif;
    }

    .workspace,
    #book {
      padding: clamp(22px, 5vw, 45px);
      background: #fffdf8;
      border: 1px solid #e5dfd2;
      border-radius: 18px;
      box-shadow: 0 15px 45px rgba(35, 72, 58, 0.08);
    }

    label {
      display: block;
      margin: 18px 0 8px;
      color: #23483a;
      font: 700 13px Arial, sans-serif;
    }

    input,
    textarea,
    select {
      width: 100%;
      padding: 14px;
      border: 1px solid #e5dfd2;
      border-radius: 8px;
      background: white;
      font: 16px Arial, sans-serif;
    }

    textarea {
      min-height: 145px;
      resize: vertical;
    }

    .row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 18px;
    }

    button {
      margin-top: 25px;
      padding: 15px 24px;
      color: white;
      background: #23483a;
      border: 0;
      border-radius: 8px;
      cursor: pointer;
      font: 700 15px Arial, sans-serif;
    }

    button:disabled {
      opacity: 0.6;
      cursor: wait;
    }

    #status {
      min-height: 25px;
      margin: 22px 0;
      color: #b17d35;
      font: 700 15px Arial, sans-serif;
      text-align: center;
    }

    #book {
      display: none;
      margin-top: 30px;
      line-height: 1.8;
    }

    #book h2 {
      margin-bottom: 8px;
      color: #23483a;
      font-size: clamp(30px, 5vw, 52px);
      line-height: 1.1;
    }

    #book h3 {
      margin-top: 35px;
      color: #23483a;
      font-size: 24px;
    }

    .muted {
      color: #6c7169;
      font-style: italic;
    }

    .content {
      white-space: pre-wrap;
      font-size: 17px;
    }

    @media (max-width: 650px) {
      header {
        padding: 18px 5%;
      }

      header span {
        display: none;
      }

      .row {
        grid-template-columns: 1fr;
        gap: 0;
      }
    }
  </style>
</head>

<body>
  <header>
    <div class="logo">MARABU BOOK STUDIO</div>
    <span>Turn your idea into a book</span>
  </header>

  <main>
    <section class="hero">
      <h1>Your idea.<br>A complete book.</h1>
      <p>Write an idea and let MARABU BOOK STUDIO create your e-book.</p>
    </section>

    <section class="workspace">
      <label for="title">Book title (optional)</label>
      <input id="title" placeholder="Example: The Future of Personal Finance">

      <label for="idea">What should your book be about?</label>
      <textarea id="idea" placeholder="Example: Create a beginner-friendly book for commerce students about managing money..."></textarea>

      <div class="row">
        <div>
          <label for="genre">Genre</label>
          <select id="genre">
            <option>Educational</option>
            <option>Self-help</option>
            <option>Business</option>
            <option>Story</option>
            <option>Children's Book</option>
            <option>Fiction</option>
          </select>
        </div>

        <div>
          <label for="tone">Tone</label>
          <select id="tone">
            <option>Friendly</option>
            <option>Professional</option>
            <option>Inspirational</option>
            <option>Simple</option>
            <option>Academic</option>
          </select>
        </div>
      </div>

      <div class="row">
        <div>
          <label for="audience">Target audience</label>
          <input id="audience" value="Students and general readers">
        </div>

        <div>
          <label for="chapters">Number of chapters</label>
          <select id="chapters">
            <option value="4">4</option>
            <option value="5" selected>5</option>
            <option value="6">6</option>
            <option value="8">8</option>
          </select>
        </div>
      </div>

      <button id="generate">Create My E-Book</button>
      <div id="status"></div>
      <article id="book"></article>
    </section>
  </main>

  <script>
    const BACKEND_URL = "PASTE_YOUR_RENDER_BACKEND_URL_HERE";

    const generateButton = document.getElementById("generate");
    const status = document.getElementById("status");
    const bookElement = document.getElementById("book");

    function escapeHtml(value = "") {
      return String(value)
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");
    }

    function displayBook(book) {
      const chapters = Array.isArray(book.chapters) ? book.chapters : [];

      bookElement.innerHTML = `
        <h2>${escapeHtml(book.title)}</h2>
        <p class="muted">${escapeHtml(book.subtitle || "")}</p>
        <p class="muted">By ${escapeHtml(book.author || "MARABU BOOK STUDIO")}</p>

        <h3>Introduction</h3>
        <p class="content">${escapeHtml(book.introduction || "")}</p>

        <h3>Table of Contents</h3>
        <ol>
          ${chapters.map(chapter => `<li>${escapeHtml(chapter.title)}</li>`).join("")}
        </ol>

        ${chapters.map((chapter, index) => `
          <section>
            <h3>Chapter ${index + 1}: ${escapeHtml(chapter.title)}</h3>
            <div class="content">${escapeHtml(chapter.content)}</div>
          </section>
        `).join("")}

        <h3>Conclusion</h3>
        <p class="content">${escapeHtml(book.conclusion || "")}</p>
      `;

      bookElement.style.display = "block";
      bookElement.scrollIntoView({ behavior: "smooth" });
    }

    generateButton.addEventListener("click", async () => {
      const idea = document.getElementById("idea").value.trim();

      if (idea.length < 10) {
        status.textContent = "Please enter a detailed book idea.";
        return;
      }

      generateButton.disabled = true;
      status.textContent = "Building your book...";
      bookElement.style.display = "none";

      try {
        const response = await fetch(`${BACKEND_URL}/api/generate-book`, {
          method: "POST",
          headers: {
            "Content-Type": "application/json"
          },
          body: JSON.stringify({
            idea,
            title: document.getElementById("title").value.trim(),
            genre: document.getElementById("genre").value,
            tone: document.getElementById("tone").value,
            audience: document.getElementById("audience").value.trim(),
            chapters: document.getElementById("chapters").value
          })
        });

        const data = await response.json();

        if (!response.ok || !data.success) {
          throw new Error(data.error || "Book generation failed");
        }

        status.textContent = "Your e-book is ready!";
        displayBook(data.book);
      } catch (error) {
        status.textContent = error.message;
      } finally {
        generateButton.disabled = false;
      }
    });
  </script>
</body>
</html>
