<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MARABU BOOK STUDIO</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, sans-serif;
      background: #0b0b0f;
      color: white;
      min-height: 100vh;
    }

    nav {
      height: 70px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 7%;
      border-bottom: 1px solid #24242d;
    }

    .logo {
      font-size: 22px;
      font-weight: bold;
    }

    .logo span {
      color: #a855f7;
    }

    .login {
      padding: 10px 18px;
      border: 1px solid #444;
      border-radius: 10px;
      background: transparent;
      color: white;
      cursor: pointer;
    }

    .hero {
      text-align: center;
      padding: 80px 20px 40px;
    }

    .hero h1 {
      font-size: clamp(42px, 7vw, 82px);
      line-height: 1;
      margin-bottom: 20px;
    }

    .hero h1 span {
      color: #a855f7;
    }

    .hero p {
      color: #aaa;
      font-size: 18px;
      max-width: 700px;
      margin: auto;
    }

    .creator {
      max-width: 900px;
      margin: 45px auto;
      padding: 25px;
      background: #15151c;
      border: 1px solid #292934;
      border-radius: 20px;
    }

    textarea,
    select {
      width: 100%;
      padding: 15px;
      background: #0d0d12;
      color: white;
      border: 1px solid #333;
      border-radius: 10px;
      margin-bottom: 15px;
      font-size: 15px;
    }

    textarea {
      min-height: 150px;
      resize: vertical;
    }

    .options {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 12px;
    }

    .generate {
      width: 100%;
      margin-top: 10px;
      padding: 16px;
      border: none;
      border-radius: 10px;
      background: #a855f7;
      color: white;
      font-size: 17px;
      font-weight: bold;
      cursor: pointer;
    }

    .generate:hover {
      opacity: 0.9;
    }

    #result {
      display: none;
      margin-top: 25px;
      padding: 25px;
      background: #0d0d12;
      border: 1px solid #333;
      border-radius: 15px;
      white-space: pre-wrap;
      line-height: 1.7;
    }

    .loading {
      color: #a855f7;
    }

    @media(max-width: 700px) {
      .options {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>

<body>

<nav>
  <div class="logo">MARABU <span>BOOK STUDIO</span></div>
  <button class="login">Login</button>
</nav>

<section class="hero">
  <h1>Turn an <span>Idea</span> Into a Book.</h1>
  <p>
    Your idea. Your world. Your book.
    Create stories, novels, comics, manga, journals,
    educational books and more.
  </p>
</section>

<section class="creator">

  <textarea
    id="idea"
    placeholder="What do you want to create? Example: A mysterious adventure story about a boy who discovers an ancient city beneath Chennai..."
  ></textarea>

  <div class="options">

    <select id="bookType">
      <option>Let AI Decide</option>
      <option>Story Book</option>
      <option>Novel</option>
      <option>Mystery</option>
      <option>Fantasy</option>
      <option>Science Fiction</option>
      <option>Romance</option>
      <option>Horror</option>
      <option>Children's Book</option>
      <option>Manga</option>
      <option>Comic</option>
      <option>Educational Book</option>
      <option>Journal</option>
      <option>Planner</option>
      <option>Workbook</option>
      <option>Poetry</option>
    </select>

    <select id="language">
      <option>English</option>
      <option>Tamil</option>
      <option>Hindi</option>
      <option>Telugu</option>
      <option>Malayalam</option>
      <option>Kannada</option>
      <option>Japanese</option>
      <option>Korean</option>
      <option>Spanish</option>
      <option>French</option>
    </select>

    <select id="style">
      <option>AI Choose Style</option>
      <option>Cinematic</option>
      <option>Simple</option>
      <option>Dark</option>
      <option>Funny</option>
      <option>Emotional</option>
      <option>Professional</option>
    </select>

  </div>

  <button class="generate" onclick="generateBook()">
    ✨ Create My Book
  </button>

  <div id="result"></div>

</section>

<script>

async function generateBook() {

  const idea = document.getElementById("idea").value.trim();
  const type = document.getElementById("bookType").value;
  const language = document.getElementById("language").value;
  const style = document.getElementById("style").value;

  const result = document.getElementById("result");

  if (!idea) {
    alert("First tell me your book idea da 😄");
    return;
  }

  result.style.display = "block";

  result.innerHTML =
    '<div class="loading">✨ AI is understanding your idea...</div>';

  try {

    const response = await fetch(
      "https://YOUR-BACKEND-URL/generate-book",
      {
        method: "POST",

        headers: {
          "Content-Type": "application/json"
        },

        body: JSON.stringify({
          idea: idea,
          type: type,
          language: language,
          style: style
        })
      }
    );

    const data = await response.json();

    if (!response.ok) {
      throw new Error(data.error || "Something went wrong");
    }

    result.innerHTML = `
      <h2>📖 Your Book Blueprint</h2>
      <br>
      ${escapeHTML(data.result)}
    `;

  } catch (error) {

    result.innerHTML = `
      <h3>⚠️ Backend not connected yet</h3>
      <br>
      ${escapeHTML(error.message)}
    `;

  }
}

function escapeHTML(text) {

  const div = document.createElement("div");
  div.textContent = text;
  return div.innerHTML;

}

</script>

</body>
</html>
